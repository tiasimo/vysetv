<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b88"/>
      <stop offset=".45" stop-color="#2c2f42"/>
      <stop offset="1" stop-color="#121320"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#383b52"/>
      <stop offset=".45" stop-color="#1b1d2b"/>
      <stop offset="1" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3fb"/>
      <stop offset="1" stop-color="#666b88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="eyeL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="eyeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- helm: lit left half, shaded right half -->
  <polygon points="256,40 190,78 142,150 126,240 140,322 178,392 222,440 256,472" fill="url(#lit)"/>
  <polygon points="256,40 322,78 370,150 386,240 372,322 334,392 290,440 256,472" fill="url(#shade)"/>

  <!-- crest ridge -->
  <polygon points="256,46 264,92 260,236 256,250 252,236 248,92" fill="url(#ridge)"/>

  <!-- V brow cut the eyes sit in -->
  <polygon points="128,224 256,262 384,224 378,262 256,308 134,262" fill="#04050a"/>

  <!-- cheek plate seam + breath slits -->
  <polyline points="140,322 256,368 372,322" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="3"/>
  <g stroke="#000" stroke-opacity=".55" stroke-width="5" stroke-linecap="round">
    <line x1="232" y1="398" x2="232" y2="426"/>
    <line x1="256" y1="404" x2="256" y2="436"/>
    <line x1="280" y1="398" x2="280" y2="426"/>
  </g>

  <!-- rim -->
  <polygon points="256,40 322,78 370,150 386,240 372,322 334,392 290,440 256,472 222,440 178,392 140,322 126,240 142,150 190,78"
           fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="3" stroke-linejoin="round"/>
</svg>
