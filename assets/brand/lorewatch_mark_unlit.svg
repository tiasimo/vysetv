<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a80a3"/>
      <stop offset=".5" stop-color="#2e3146"/>
      <stop offset="1" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4e6b"/>
      <stop offset=".5" stop-color="#1c1e2c"/>
      <stop offset="1" stop-color="#0b0c13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a2a08"/>
      <stop offset=".45" stop-color="#4a1e04"/>
      <stop offset="1" stop-color="#2e1203"/>
    </linearGradient>
    <radialGradient id="iris" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1a1b29"/>
      <stop offset="1" stop-color="#06070c"/>
    </radialGradient>
  </defs>

  <!-- open book -->
  <path d="M256 300 C214 278 156 270 92 280 L92 410 C156 400 214 408 256 430 Z" fill="url(#pageL)"/>
  <path d="M256 300 C298 278 356 270 420 280 L420 410 C356 400 298 408 256 430 Z" fill="url(#pageR)"/>
  <!-- page lines -->
  <g fill="none" stroke="#8a8fae" stroke-opacity=".35" stroke-width="5" stroke-linecap="round">
    <path d="M122 316 C162 310 200 314 232 326"/>
    <path d="M122 346 C162 340 200 344 232 356"/>
    <path d="M122 376 C162 370 200 374 232 386"/>
    <path d="M390 316 C350 310 312 314 280 326"/>
    <path d="M390 346 C350 340 312 344 280 356"/>
    <path d="M390 376 C350 370 312 374 280 386"/>
  </g>
  <!-- gilded page edges -->
  <path d="M92 280 C156 270 214 278 256 300 C298 278 356 270 420 280" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- spine -->
  <path d="M256 300 L256 430" stroke="#04050a" stroke-width="6"/>

  <!-- the eye rising from the pages -->
  
  <path d="M96 196 C150 114 362 114 416 196 C362 278 150 278 96 196 Z" fill="#0b0c14" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <circle cx="256" cy="196" r="58" fill="url(#iris)" stroke="url(#gold)" stroke-width="8"/>
  <!-- play triangle as the pupil -->
  <path d="M238 166 L288 196 L238 226 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
</svg>
