<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VyseTV Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07080f; --fg:#f4f5fb; --accent:#ffa53a; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:Inter, system-ui, sans-serif; }
  .showcase { min-height:100vh; display:flex; flex-wrap:wrap; gap:48px; align-items:center; justify-content:center; padding:48px 16px; }

  /* the eyes glow: blurred copy of the mark behind itself */
  .lit { position:relative; }
  .lit img { position:relative; display:block; }
  .lit::before { content:""; position:absolute; left:22%; right:22%; top:46%; height:16%;
                 background:radial-gradient(closest-side, rgba(255,140,30,.55), rgba(255,140,30,0)); filter:blur(6px); }

  .icon { width:1024px; height:1024px; border-radius:228px; overflow:hidden; position:relative;
          background:radial-gradient(circle at 50% 45%, #1a1c30 0%, #0c0d18 55%, #06070c 100%); }
  .icon::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow: inset 0 0 0 4px rgba(255,255,255,.05); }
  .icon .lit { position:absolute; inset:96px; }
  .icon img { width:832px; height:832px; }

  .wordmark { display:flex; align-items:center; gap:26px; padding:24px 40px; }
  .wordmark img { width:190px; height:190px; }
  .wordmark span { font-weight:800; font-size:140px; letter-spacing:-5px; }
  .wordmark b { color:var(--accent); font-weight:800; }

  body.export { background:transparent; }
  body.export .showcase { padding:0; min-height:0; display:block; }
  body.export .item { display:none; }
  body.export .item.on { display:block; }
  @media (max-width: 1100px) { body:not(.export) .icon { transform:scale(.3); margin:-358px; } }
</style>
</head>
<body>
<div class="showcase">
  <div class="item" id="mark"><div class="lit"><img src="vyse_mark.svg" width="1024" height="1024" alt="VyseTV mark"></div></div>
  <div class="item" id="icon"><div class="icon"><div class="lit"><img src="vyse_mark.svg" alt=""></div></div></div>
  <div class="item" id="wordmark"><div class="wordmark"><div class="lit"><img src="vyse_mark.svg" alt=""></div><span>Vyse<b>TV</b></span></div></div>
</div>
<script>
  // #mark / #icon / #wordmark isolates one item for headless PNG export
  const id = location.hash.slice(1);
  if (id) { document.body.classList.add('export'); document.getElementById(id).classList.add('on'); }
  else { const img = document.querySelector('#mark img'); img.width = 320; img.height = 320; }
</script>
</body>
</html>
